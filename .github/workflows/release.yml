name: Build and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish (leave blank for build artifacts only)"
        required: false
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: env.RELEASE_TAG != ''
        run: node -e 'if (process.env.RELEASE_TAG !== "v"+require("./package.json").version) process.exit(1)'
      - name: Build and test
        run: npm test
      - name: Package both Mac architectures
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "$APPLE_ID" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "GLB Viewer $RELEASE_TAG" --notes-file docs/release-notes.md --verify-tag --draft
          fi
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/latest*.yml release/*.blockmap --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file docs/release-notes.md
